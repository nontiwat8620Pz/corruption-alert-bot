<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <title>CORRUPTX 7DS Origin — Live Timer</title>
  <style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap');
:root{color-scheme:dark;font-family:'Noto Sans Thai',system-ui,sans-serif;--gold:#e4bd72;--gold-bright:#ffe2a0;--cyan:#8ee8ff;--panel:rgba(9,22,43,.62);--line:rgba(226,190,120,.72)}
*{box-sizing:border-box}
body{position:relative;isolation:isolate;margin:0;min-height:100vh;padding:16px 12px 32px;background:#091629;color:#f8fafc}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:linear-gradient(rgba(5,14,30,.48),rgba(5,14,30,.66)),url('/assets/checkboss-reference.webp');background-position:center top;background-size:cover;background-repeat:no-repeat;filter:blur(8px);transform:scale(1.045);opacity:.82}
main{width:min(100%,620px);margin:0 auto}
.hero-art{width:100%;background-repeat:no-repeat;background-position:center top;background-size:100% auto;border:1px solid var(--line);border-bottom:0;border-radius:23px 23px 0 0;box-shadow:0 14px 34px rgba(0,0,0,.38)}
.checkboss-art{aspect-ratio:1.81;background-image:url('/assets/checkboss-reference.webp')}
header{position:relative;margin:0;padding:15px 15px 17px;text-align:center;overflow:hidden;border:1px solid var(--line);border-top:1px solid rgba(255,225,160,.5);border-radius:0 0 23px 23px;background:linear-gradient(135deg,rgba(12,31,58,.66),rgba(5,17,37,.58));backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);box-shadow:0 14px 34px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.16)}
h1{margin:0 0 12px;padding:10px 8px;border:1px solid rgba(255,218,145,.9);border-radius:13px;background:linear-gradient(100deg,#091a34,#18365b 50%,#091a34);color:var(--gold-bright);font:800 clamp(1.15rem,4.8vw,1.55rem)/1.2 'Cinzel','Noto Sans Thai',serif;letter-spacing:.035em;text-shadow:0 2px 8px #000;box-shadow:0 6px 16px rgba(0,0,0,.3)}
#clock{font-size:clamp(2.45rem,10vw,3.35rem);font-weight:800;line-height:1.08;font-variant-numeric:tabular-nums;letter-spacing:.035em;color:#e6f7ff;text-shadow:0 0 18px rgba(89,204,255,.4)}
.zone{margin-top:5px;color:#c4d3e5;font-size:.98rem}
.section-title{margin:19px 4px 12px;padding:10px 13px;border-left:4px solid #e6bd70;border-radius:0 12px 12px 0;background:linear-gradient(90deg,rgba(27,48,76,.64),rgba(13,26,48,.38));backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);color:#ffe0a0;font-size:1rem;font-weight:800}
.timer-card{position:relative;display:grid;grid-template-columns:78px minmax(0,1fr);grid-template-rows:auto auto auto auto;column-gap:13px;align-items:center;min-height:155px;margin-bottom:13px;padding:15px 15px 14px 12px;overflow:hidden;border:1px solid var(--line);border-radius:21px;background:linear-gradient(110deg,rgba(8,23,48,.66),rgba(20,43,72,.56) 55%,rgba(8,19,39,.68));backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);box-shadow:0 12px 28px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.16),inset 0 0 22px rgba(135,196,255,.06)}
.portrait{grid-column:1;grid-row:1/4;width:76px;height:76px;border:3px solid #edc777;border-radius:50%;background-image:url('/assets/checkboss-reference.webp');background-repeat:no-repeat;background-size:360% auto;box-shadow:0 0 0 4px rgba(228,189,114,.16),0 0 18px rgba(228,189,114,.22)}
.portrait-zephyrus{background-position:5% 50%}
.portrait-porpxe{background-position:5% 75%}
.account{grid-column:2;grid-row:1;color:#f4d28b;font:700 .75rem 'Cinzel',serif;letter-spacing:.11em}
.timer-card h2{grid-column:2;grid-row:2;margin:2px 0 0;font-size:1.16rem;color:#fff}
.countdown{grid-column:2;grid-row:3;margin:3px 0;font-size:clamp(1.9rem,8vw,2.65rem);font-weight:800;line-height:1.12;font-variant-numeric:tabular-nums;letter-spacing:.035em;color:#9cecff;text-shadow:0 0 8px rgba(77,210,255,.7),0 0 22px rgba(77,210,255,.4)}
.spawn{grid-column:1/-1;grid-row:4;margin-top:9px;padding-top:8px;border-top:1px solid rgba(226,190,120,.28);color:#d3deed;font-size:.84rem;line-height:1.55}
.notice{margin-top:15px;padding:13px;border:1px solid rgba(228,189,114,.48);border-radius:17px;background:rgba(7,18,37,.58);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);color:#d3deed;line-height:1.65;text-align:center;box-shadow:0 10px 25px rgba(0,0,0,.25)}
.status{margin-top:11px;font-size:.82rem;color:#a8bad1;text-align:center}
.error{color:#fca5a5!important}
@media(max-width:420px){body{padding:13px 10px 25px}.timer-card{grid-template-columns:68px minmax(0,1fr);column-gap:10px;min-height:146px;padding:13px 11px}.portrait{width:66px;height:66px}.countdown{font-size:clamp(1.8rem,8vw,2.25rem)}.spawn{font-size:.78rem}.section-title{font-size:.93rem}}

  </style>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>
  <main>
    <div class="hero-art checkboss-art" role="img" aria-label="The Seven Deadly Sins Origin and Meliodas"></div>
    <header>
      <h1>👑 CHECK BOSS</h1>
      <div id="clock" aria-live="off">--:--:--</div>
      <div class="zone">🕒 เวลาประเทศไทย (UTC+7)</div>
    </header>

    <h2 class="section-title">👑 CORRUPTION BOSS — NEXT SPAWN</h2>
    <section class="timer-card" aria-label="Zephyrus timer">
      <div class="portrait portrait-zephyrus" aria-hidden="true"></div>
      <div class="account">✦ ACCOUNT 01</div>
      <h2>Zephyrus</h2>
      <div class="countdown" id="timer-Zephyrus">--:--:--</div>
      <div class="spawn" id="spawn-Zephyrus">📅 กำลังโหลดเวลาเกิดบอส...</div>
    </section>
    <section class="timer-card" aria-label="PORPXE timer">
      <div class="portrait portrait-porpxe" aria-hidden="true"></div>
      <div class="account">✦ ACCOUNT 02</div>
      <h2>PORPXE</h2>
      <div class="countdown" id="timer-PORPXE">--:--:--</div>
      <div class="spawn" id="spawn-PORPXE">📅 กำลังโหลดเวลาเกิดบอส...</div>
    </section>

    <div class="notice" id="message">✨ กำลังตรวจสอบบัญชี LINE...</div>
    <div class="status" id="updated"></div>
  </main>

  <script>
    const LIFF_ID = "2012490657-JcCNWNo5";
    const clock = document.getElementById("clock");
    const message = document.getElementById("message");
    const updated = document.getElementById("updated");
    const thaiTime = new Intl.DateTimeFormat("th-TH", {
      timeZone: "Asia/Bangkok",
      hour: "2-digit",
      minute: "2-digit",
      second: "2-digit",
      hour12: false
    });
    const thaiDateTime = new Intl.DateTimeFormat("th-TH", {
      timeZone: "Asia/Bangkok",
      dateStyle: "medium",
      timeStyle: "medium"
    });

    let timers = {};
    let serverClockAnchorMs = null;
    let serverClockAnchorPerf = null;

    function synchronizedNow() {
      if (serverClockAnchorMs === null || serverClockAnchorPerf === null) {
        return Date.now();
      }
      return serverClockAnchorMs + (performance.now() - serverClockAnchorPerf);
    }

    function updateClock() {
      clock.textContent = thaiTime.format(new Date(synchronizedNow()));
    }

    function formatDuration(milliseconds) {
      const total = Math.max(0, Math.floor(milliseconds / 1000));
      const hours = Math.floor(total / 3600);
      const minutes = Math.floor((total % 3600) / 60);
      const seconds = total % 60;
      return [hours, minutes, seconds].map(value => String(value).padStart(2, "0")).join(":");
    }

    function renderTimers() {
      for (const account of ["Zephyrus", "PORPXE"]) {
        const timerEl = document.getElementById("timer-" + account);
        const spawnEl = document.getElementById("spawn-" + account);
        const timer = timers[account];

        if (!timer || !Number.isFinite(Number(timer.spawnAt))) {
          timerEl.textContent = "--:--:--";
          spawnEl.textContent = "ยังไม่มีข้อมูลเวลาเกิดบอส";
          continue;
        }

        const remaining = Number(timer.spawnAt) - synchronizedNow();
        timerEl.textContent = remaining <= 0 ? "กำลังเกิด / รอรอบถัดไป" : formatDuration(remaining);
        spawnEl.textContent = "เวลาเกิดโดยประมาณ: " + thaiDateTime.format(new Date(Number(timer.spawnAt)));
      }
    }

    async function loadTimers(idToken) {
      const requestStartedAt = performance.now();
      const response = await fetch("/api/liff-status", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ idToken }),
        cache: "no-store"
      });

      const data = await response.json();
      const responseReceivedAt = performance.now();
      if (!response.ok) {
        throw new Error(data.error || "ไม่สามารถยืนยันบัญชี LINE ได้");
      }

      if (Number.isFinite(Number(data.serverTime))) {
        // Estimate the server/client clock offset at the request midpoint.
        // Countdown rendering then advances from a monotonic performance clock,
        // avoiding drift from the device's wall clock.
        serverClockAnchorMs = Number(data.serverTime);
        serverClockAnchorPerf = (requestStartedAt + responseReceivedAt) / 2;
      }

      timers = data.accounts || {};
      renderTimers();
      updateClock();
      updated.textContent = "อัปเดตข้อมูลล่าสุด: " + thaiDateTime.format(new Date(synchronizedNow()));
      message.textContent = "ยืนยันบัญชี LINE สำเร็จ";
    }

    async function start() {
      try {
        await liff.init({ liffId: LIFF_ID });

        if (!liff.isLoggedIn()) {
          liff.login({ redirectUri: window.location.href });
          return;
        }

        const idToken = liff.getIDToken();
        if (!idToken) {
          throw new Error("ไม่พบ ID Token กรุณาปิดแล้วเปิด LIFF ใหม่ และอนุญาตสิทธิ์ openid");
        }

        await loadTimers(idToken);
        window.setInterval(renderTimers, 1000);
        window.setInterval(() => loadTimers(idToken).catch(error => {
          message.textContent = error.message;
          message.className = "notice error";
        }), 30000);
      } catch (error) {
        message.textContent = error.message || "เกิดข้อผิดพลาดในการเปิด Live Timer";
        message.className = "notice error";
      }
    }

    updateClock();
    window.setInterval(updateClock, 250);
    start();
  </script>
</body>
</html>
