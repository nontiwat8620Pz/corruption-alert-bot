  <style>

    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap');
    :root { color-scheme: dark; font-family: 'Noto Sans Thai', system-ui, sans-serif; --gold:#e4bd72; --gold-bright:#ffe2a0; --cyan:#8ee8ff; --panel:rgba(9,19,38,.84); --line:rgba(226,190,120,.38); }
    * { box-sizing: border-box; }
    body { position:relative; isolation:isolate; margin:0; min-height:100vh; padding:24px 14px 36px; background:radial-gradient(ellipse at 50% 0%,#1b3150 0%,#0b1427 58%,#070d19 100%); color:#f8fafc; }
    body::before { content:""; position:fixed; inset:0; z-index:-1; pointer-events:none; background:url('/corruptx-bg.svg') center center / cover no-repeat; opacity:.40; }
    main { width:min(100%,560px); margin:0 auto; }
    header,.timer-card,.notice,.panel { border:1px solid var(--line); border-radius:20px; background:linear-gradient(145deg,rgba(16,31,55,.91),var(--panel)); box-shadow:0 14px 36px rgba(0,0,0,.34),inset 0 1px 0 rgba(255,231,180,.09); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); }
    header { padding:23px 20px; text-align:center; position:relative; overflow:hidden; }
    header::after { content:""; position:absolute; left:16%; right:16%; bottom:0; height:1px; background:linear-gradient(90deg,transparent,var(--gold),transparent); }
    .eyebrow { color:var(--gold-bright); letter-spacing:.18em; font:700 .78rem 'Cinzel',serif; text-shadow:0 0 14px rgba(228,189,114,.25); }
    h1 { margin:9px 0 15px; font-size:1.38rem; font-weight:800; letter-spacing:.02em; text-shadow:0 2px 16px rgba(0,0,0,.6); }
    #clock { font-size:clamp(2.4rem,10vw,3.5rem); font-weight:800; font-variant-numeric:tabular-nums; letter-spacing:.045em; color:#e6f7ff; text-shadow:0 0 22px rgba(89,204,255,.35); }
    .zone,.muted,.hint { color:#b6c6dc; }
    .section-title { margin:23px 4px 12px; font-size:1rem; font-weight:750; color:var(--gold-bright); }
    .timer-card { padding:18px; margin-bottom:13px; position:relative; overflow:hidden; }
    .timer-card::before { content:""; position:absolute; top:0; left:18px; right:18px; height:1px; background:linear-gradient(90deg,transparent,rgba(142,232,255,.65),transparent); }
    .account { color:var(--gold); font:700 .78rem 'Cinzel',serif; letter-spacing:.12em; }
    .timer-card h2 { margin:5px 0; font-size:1.12rem; }
    .countdown { margin:8px 0; font-size:clamp(2rem,8vw,2.8rem); font-weight:800; font-variant-numeric:tabular-nums; letter-spacing:.04em; color:var(--cyan); text-shadow:0 0 20px rgba(82,207,255,.32); }
    .spawn { color:#d3deed; font-size:.9rem; line-height:1.6; }
    .notice { margin-top:16px; padding:14px; color:#d3deed; line-height:1.65; text-align:center; }
    .status { margin-top:12px; font-size:.82rem; color:#a8bad1; text-align:center; }
    .error { color:#fca5a5 !important; }
    @media(max-width:420px) { body{padding:16px 11px 28px} header{padding:20px 15px} .timer-card{padding:15px} }

  
    /* Ref-inspired hero and premium fantasy HUD */
    body { padding:16px 12px 34px; background:#091326; }
    body::before { opacity:.48; background-position:center 38%; }
    main { width:min(100%,620px); }
    header { min-height:260px; padding:26px 18px 22px; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; border:1px solid rgba(255,218,145,.7); border-radius:24px; background:linear-gradient(180deg,rgba(6,16,34,.08) 0%,rgba(7,17,36,.25) 28%,rgba(5,14,31,.94) 100%),url('/corruptx-bg.svg') center 34%/cover; box-shadow:0 16px 42px rgba(0,0,0,.46),inset 0 0 35px rgba(109,185,255,.12); }
    header::before { content:"✦  THE SEVEN DEADLY SINS  ✦"; position:absolute; top:20px; left:0; right:0; color:#ffe1a0; font:700 .72rem 'Cinzel',serif; letter-spacing:.16em; text-shadow:0 2px 8px #000; }
    header::after { left:8%; right:8%; bottom:0; height:2px; }
    .eyebrow { display:inline-block; padding:7px 18px; border:1px solid rgba(255,219,145,.7); border-radius:999px; background:rgba(8,20,41,.72); color:#ffe3a7; }
    h1 { width:100%; margin:13px 0 10px; padding:12px 10px; border:1px solid rgba(255,218,145,.85); border-radius:14px; background:linear-gradient(100deg,rgba(7,18,39,.96),rgba(20,43,74,.91),rgba(7,18,39,.96)); color:#ffe2a0; font:800 clamp(1.2rem,5vw,1.65rem) 'Cinzel','Noto Sans Thai',serif; letter-spacing:.04em; text-shadow:0 2px 8px #000,0 0 15px rgba(255,205,112,.28); box-shadow:0 8px 20px rgba(0,0,0,.3); }
    #clock { line-height:1.05; }
    .section-title { margin:21px 4px 12px; padding:10px 14px; border-left:4px solid #e6bd70; border-radius:0 12px 12px 0; background:linear-gradient(90deg,rgba(27,48,76,.94),rgba(13,26,48,.45)); color:#ffe0a0; font-size:1.02rem; }
    .timer-card { display:grid; grid-template-columns:76px minmax(0,1fr); grid-template-rows:auto auto auto auto; column-gap:14px; align-items:center; min-height:174px; padding:17px 17px 17px 14px; border:1px solid rgba(157,209,255,.58); border-radius:22px; background:linear-gradient(110deg,rgba(8,23,48,.91),rgba(20,43,72,.82) 55%,rgba(8,19,39,.93)); box-shadow:0 12px 28px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.12),inset 0 0 28px rgba(75,155,232,.1); }
    .timer-card::after { content:"♛"; grid-column:1; grid-row:1 / 5; width:68px; height:68px; display:grid; place-items:center; border:2px solid #edc777; border-radius:50%; background:radial-gradient(circle at 35% 25%,#537ca7,#172d4d 68%,#09172b); color:#ffe2a0; font-size:2rem; text-shadow:0 0 15px rgba(255,211,120,.65); box-shadow:0 0 0 4px rgba(228,189,114,.12),0 0 20px rgba(228,189,114,.2); }
    .account { grid-column:2; grid-row:1; color:#f4d28b; font-size:.72rem; }
    .timer-card h2 { grid-column:2; grid-row:2; margin:2px 0 0; font-size:1.15rem; color:#fff; }
    .countdown { grid-column:2; grid-row:3; margin:3px 0; font-size:clamp(2rem,8vw,2.65rem); line-height:1.12; color:#9cecff; text-shadow:0 0 8px rgba(77,210,255,.8),0 0 24px rgba(77,210,255,.45); }
    .spawn { grid-column:1 / -1; grid-row:4; margin-top:10px; padding-top:9px; border-top:1px solid rgba(226,190,120,.25); font-size:.84rem; }
    .notice { border-color:rgba(228,189,114,.4); background:rgba(7,18,37,.88); }
    @media(max-width:420px) { header{min-height:238px;padding:22px 13px 18px} .timer-card{grid-template-columns:60px minmax(0,1fr);column-gap:11px;padding:14px 12px;min-height:160px} .timer-card::after{width:54px;height:54px;font-size:1.65rem} .countdown{font-size:clamp(1.75rem,8vw,2.2rem)} .spawn{font-size:.78rem} }

  
    /* CORRUPTX approved artwork integration */
    body { background:linear-gradient(180deg,#dcecff 0%,#152b4b 38%,#091326 100%); }
    body::before {
      background-image:linear-gradient(180deg,rgba(7,17,36,.36),rgba(7,17,36,.74)),url('/assets/checkboss-reference.webp');
      background-position:center top;
      background-size:cover;
      opacity:.42;
    }
    main { width:min(100%,620px); }
    header {
      min-height:290px;
      justify-content:flex-end;
      background-image:linear-gradient(180deg,rgba(6,16,34,.04) 0%,rgba(7,17,36,.12) 34%,rgba(5,14,31,.94) 100%),url('/assets/checkboss-reference.webp');
      background-size:100% auto;
      background-position:center 17%;
      border-color:rgba(255,218,145,.82);
    }
    header::before { content:"THE SEVEN DEADLY SINS  •  ORIGIN"; top:14px; font-size:.68rem; }
    .eyebrow { color:#ffe1a0; text-shadow:0 0 12px rgba(255,211,120,.6); }
    h1 { border-radius:14px; }
    .timer-card {
      background:linear-gradient(110deg,rgba(8,23,48,.94),rgba(20,43,72,.88) 55%,rgba(8,19,39,.95));
      border-color:rgba(255,218,145,.64);
      backdrop-filter:blur(14px);
    }
    .notice { background:rgba(8,20,41,.9); border-color:rgba(255,218,145,.62); }
    @media(max-width:420px) {
      header { min-height:260px; background-position:center 15%; }
    }

  </style>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>
  <main>
    <header>
      <div class="eyebrow">CORRUPTX 7DS ORIGIN</div>
      <h1>⚔️ LIVE BOSS TIMER</h1>
      <div id="clock" aria-live="off">--:--:--</div>
      <div class="zone">🕒 เวลาประเทศไทย (UTC+7)</div>
    </header>

    <h2 class="section-title">👑 CORRUPTION BOSS — NEXT SPAWN</h2>
    <section class="timer-card" aria-label="Zephyrus timer">
      <div class="account">✦ ACCOUNT 01</div>
      <h2>Zephyrus</h2>
      <div class="countdown" id="timer-Zephyrus">--:--:--</div>
      <div class="spawn" id="spawn-Zephyrus">📅 กำลังโหลดเวลาเกิดบอส...</div>
    </section>
    <section class="timer-card" aria-label="PORPXE timer">
      <div class="account">✦ ACCOUNT 02</div>
      <h2>PORPXE</h2>
      <div class="countdown" id="timer-PORPXE">--:--:--</div>
      <div class="spawn" id="spawn-PORPXE">📅 กำลังโหลดเวลาเกิดบอส...</div>
    </section>

    <div class="notice" id="message">✨ กำลังตรวจสอบบัญชี LINE...</div>
    <div class="status" id="updated"></div>
  </main>

  <script>
    const LIFF_ID = "2012490657-JcCNWNo5";
    const clock = document.getElementById("clock");
    const message = document.getElementById("message");
    const updated = document.getElementById("updated");
    const thaiTime = new Intl.DateTimeFormat("th-TH", {
      timeZone: "Asia/Bangkok",
      hour: "2-digit",
      minute: "2-digit",
      second: "2-digit",
      hour12: false
    });
    const thaiDateTime = new Intl.DateTimeFormat("th-TH", {
      timeZone: "Asia/Bangkok",
      dateStyle: "medium",
      timeStyle: "medium"
    });

    let timers = {};
    let serverClockAnchorMs = null;
    let serverClockAnchorPerf = null;

    function synchronizedNow() {
      if (serverClockAnchorMs === null || serverClockAnchorPerf === null) {
        return Date.now();
      }
      return serverClockAnchorMs + (performance.now() - serverClockAnchorPerf);
    }

    function updateClock() {
      clock.textContent = thaiTime.format(new Date(synchronizedNow()));
    }

    function formatDuration(milliseconds) {
      const total = Math.max(0, Math.floor(milliseconds / 1000));
      const hours = Math.floor(total / 3600);
      const minutes = Math.floor((total % 3600) / 60);
      const seconds = total % 60;
      return [hours, minutes, seconds].map(value => String(value).padStart(2, "0")).join(":");
    }

    function renderTimers() {
      for (const account of ["Zephyrus", "PORPXE"]) {
        const timerEl = document.getElementById("timer-" + account);
        const spawnEl = document.getElementById("spawn-" + account);
        const timer = timers[account];

        if (!timer || !Number.isFinite(Number(timer.spawnAt))) {
          timerEl.textContent = "--:--:--";
          spawnEl.textContent = "ยังไม่มีข้อมูลเวลาเกิดบอส";
          continue;
        }

        const remaining = Number(timer.spawnAt) - synchronizedNow();
        timerEl.textContent = remaining <= 0 ? "กำลังเกิด / รอรอบถัดไป" : formatDuration(remaining);
        spawnEl.textContent = "เวลาเกิดโดยประมาณ: " + thaiDateTime.format(new Date(Number(timer.spawnAt)));
      }
    }

    async function loadTimers(idToken) {
      const requestStartedAt = performance.now();
      const response = await fetch("/api/liff-status", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ idToken }),
        cache: "no-store"
      });

      const data = await response.json();
      const responseReceivedAt = performance.now();
      if (!response.ok) {
        throw new Error(data.error || "ไม่สามารถยืนยันบัญชี LINE ได้");
      }

      if (Number.isFinite(Number(data.serverTime))) {
        // Estimate the server/client clock offset at the request midpoint.
        // Countdown rendering then advances from a monotonic performance clock,
        // avoiding drift from the device's wall clock.
        serverClockAnchorMs = Number(data.serverTime);
        serverClockAnchorPerf = (requestStartedAt + responseReceivedAt) / 2;
      }

      timers = data.accounts || {};
      renderTimers();
      updateClock();
      updated.textContent = "อัปเดตข้อมูลล่าสุด: " + thaiDateTime.format(new Date(synchronizedNow()));
      message.textContent = "ยืนยันบัญชี LINE สำเร็จ";
    }

    async function start() {
      try {
        await liff.init({ liffId: LIFF_ID });

        if (!liff.isLoggedIn()) {
          liff.login({ redirectUri: window.location.href });
          return;
        }

        const idToken = liff.getIDToken();
        if (!idToken) {
          throw new Error("ไม่พบ ID Token กรุณาปิดแล้วเปิด LIFF ใหม่ และอนุญาตสิทธิ์ openid");
        }

        await loadTimers(idToken);
        window.setInterval(renderTimers, 1000);
        window.setInterval(() => loadTimers(idToken).catch(error => {
          message.textContent = error.message;
          message.className = "notice error";
        }), 30000);
      } catch (error) {
        message.textContent = error.message || "เกิดข้อผิดพลาดในการเปิด Live Timer";
        message.className = "notice error";
      }
    }

    updateClock();
    window.setInterval(updateClock, 250);
    start();
  </script>
</body>
</html>
